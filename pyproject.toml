[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rich-h2h-simulator"
version = "0.3.0"
description = "Dev-only H2H merchant/trader simulator for platform_rich"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "OpenAI" }
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[project.scripts]
rich-h2h-simulator = "rich_h2h_simulator.main:run"
rich-h2h-simulator-validate = "rich_h2h_simulator.cli:main"
rich-h2h-simulator-export-schemas = "rich_h2h_simulator.schema_export:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
