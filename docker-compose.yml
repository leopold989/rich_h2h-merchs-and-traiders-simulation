version: '3.9'
services:
  rich-h2h-simulator:
    build: .
    container_name: ${SIM_CONTAINER_NAME:-rich-h2h-simulator}
    ports:
      - '${SIM_PORT:-8099}:8099'
    environment:
      SIM_SYSTEM_CONFIG: ${SIM_SYSTEM_CONFIG:-/app/config/system.json}
    volumes:
      - ${SIM_CONFIG_DIR:-./config}:/app/config
      - ${SIM_LOGS_DIR:-./logs}:/app/logs
      - ${SIM_FIXTURES_DIR:-./fixtures}:/app/fixtures
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8099/health", timeout=2).read()'
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
